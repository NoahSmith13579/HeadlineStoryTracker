[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "headline-story-tracker"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "feedparser==6.0.12",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
