<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Headline Story Tracker</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <h1>Headline Story Tracker</h1>
      <p id="updated">Loading live stories...</p>
      <div id="health"></div>
      <div id="stories" aria-live="polite"></div>
      <dialog id="story-dialog">
        <button id="close-dialog" type="button">Close</button>
        <article id="story-detail"></article>
      </dialog>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
