name: Scheduled pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: headline-story-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: main/requirements.txt
      - name: Install dependencies
        working-directory: main
        run: python -m pip install -r requirements.txt
      - name: Restore embedding cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hst-embedding-cache-v1
      - name: Run pipeline
        working-directory: main
        env:
          DATA_DIR: ../data
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable pipeline.yml || true
          python -m hst ingest --data-dir "$DATA_DIR"
          python -m hst embed --data-dir "$DATA_DIR"
          python -m hst cluster --data-dir "$DATA_DIR"
          python -m hst publish --data-dir "$DATA_DIR"
      - name: Commit data
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "Update headline data and pipeline state"
          git push origin data || (git fetch origin data && git rebase origin/data && git push origin data)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
